replicaCount: 2
image:
  repository: ghcr.io/alexpialetski/rsschool-devops-course-tasks/api-server
  tag: "sha-233d93d"
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
containerPort: 3000
# Environment variables for the container.
# Set OTEL_EXPORTER_OTLP_ENDPOINT to opt in to telemetry.
env:
  - name: PORT
    value: "3000"
  - name: NODE_ENV
    value: production
# Additional environment variables (same format as `env`).
extraEnv: []
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: true
  className: traefik
  annotations: {}
  # No host by default: matches any host.
  host: ""
  path: /
  pathType: Prefix
  tls: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
probes:
  startup:
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
podDisruptionBudget:
  enabled: true
  minAvailable: 1
nodeSelector: {}
tolerations: []
affinity: {}
