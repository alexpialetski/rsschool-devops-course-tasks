apiVersion: v1
kind: Pod
metadata:
  name: {{ include "api-server.fullname" . }}-test-connection
  # No selector labels: the HPA would otherwise count this pod (without cpu requests) and stop scaling
  labels:
    helm.sh/chart: {{ include "api-server.chart" . }}
    app.kubernetes.io/name: {{ include "api-server.name" . }}-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args: ["-qO-", "http://{{ include "api-server.fullname" . }}:{{ .Values.service.port }}/api/health"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
