apiVersion: v1
kind: Pod
metadata:
  name: {{ include "api-server.fullname" . }}-test-connection
  labels:
    {{- include "api-server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args: ["-qO-", "http://{{ include "api-server.fullname" . }}:{{ .Values.service.port }}/api/health"]
